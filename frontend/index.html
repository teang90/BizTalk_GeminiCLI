<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>업무 말투 변환기 - BizTone Converter</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <div class="container">
        <header>
            <h1>💼 업무 말투 변환기</h1>
            <p>전달하고 싶은 내용을 입력하면 상대방에 맞는 말투로 바꿔드려요.</p>
        </header>

        <main>
            <!-- 수신 대상 선택 -->
            <section class="target-selection">
                <h3>누구에게 보낼까요?</h3>
                <div class="button-group">
                    <button class="target-btn" data-target="boss">👔 상사/임원</button>
                    <button class="target-btn" data-target="colleague">🤝 타팀 동료</button>
                    <button class="target-btn" data-target="client">🌐 고객/외부</button>
                    <button class="target-btn" data-target="team">👥 팀 내 동료</button>
                </div>
            </section>

            <!-- 원문 입력 -->
            <section class="input-section">
                <textarea id="inputText" placeholder="내용을 편하게 입력하세요. (예: 내일까지 보고서 제출 어려울 것 같음)"></textarea>
                <button id="convertBtn" class="primary-btn">변환하기</button>
            </section>

            <!-- 결과 출력 -->
            <section class="result-section" id="resultArea" style="display: none;">
                <h3>변환 결과</h3>
                <div class="result-box">
                    <textarea id="outputText" readonly></textarea>
                    <button id="copyBtn" class="secondary-btn">복사하기 📋</button>
                </div>
            </section>
        </main>

        <!-- 로딩 표시 -->
        <div id="loadingOverlay" class="overlay" style="display: none;">
            <div class="loader"></div>
            <p>AI가 적절한 말투를 고민 중입니다...</p>
        </div>

        <footer>
            <p>&copy; 2026 BizTone Converter. All rights reserved.</p>
        </footer>
    </div>
    <script src="js/app.js"></script>
</body>
</html>
